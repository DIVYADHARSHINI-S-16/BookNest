version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: booknest_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: booknest_user
      POSTGRES_PASSWORD: booknest_pass
      POSTGRES_DB: booknest_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booknest_user -d booknest_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: booknest_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
    container_name: booknest_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://booknest_user:booknest_pass@postgres:5432/booknest_db
      REDIS_URL: redis://redis:6379
      CLIENT_ORIGIN: http://localhost:5173
      PORT: 4000
    ports:
      - "4000:4000"

volumes:
  postgres-data:
  redis-data:
